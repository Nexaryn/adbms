<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bracket Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e8edf5; --panel:#ffffff; --ink:#14213d; --muted:#5b6784; --line:#cfd8e6; --blue:#2f5bff; --red:#e63e5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Barlow',system-ui,sans-serif; line-height:1.5; }
  header { background:var(--ink); color:#fff; padding:20px 32px 0; }
  h1 { font-family:'Barlow Condensed',sans-serif; font-size:44px; margin:0; letter-spacing:.5px; }
  h1 span { color:#8fa6ff; }
  nav { display:flex; gap:4px; margin-top:14px; flex-wrap:wrap; }
  nav button { background:none; border:0; color:#aab6d6; font:600 20px 'Barlow Condensed',sans-serif; padding:10px 18px; cursor:pointer; border-bottom:4px solid transparent; }
  nav button.on { color:#fff; border-color:var(--red); }
  nav button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  main { max-width:1100px; margin:28px auto; padding:0 20px; display:grid; grid-template-columns:320px 1fr; gap:24px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:20px; }
  h2 { font-family:'Barlow Condensed',sans-serif; font-size:26px; margin:0 0 14px; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; }
  .btn { background:var(--blue); color:#fff; border:0; border-radius:4px; padding:10px 18px; font:600 16px 'Barlow',sans-serif; cursor:pointer; margin-top:16px; }
  .btn.ghost { background:none; color:var(--muted); border:1px solid var(--line); margin-left:6px; }
  .tbl { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:14px; color:var(--muted); font-weight:500; padding:8px; border-bottom:2px solid var(--line); }
  td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .link { background:none; border:0; color:var(--blue); cursor:pointer; font:inherit; padding:0 6px 0 0; }
  .link.del { color:var(--red); }
  .empty { color:var(--muted); padding:24px 8px; }
  .err { color:var(--red); margin-top:10px; font-size:14px; min-height:20px; }
  .rank td:first-child { font-family:'Barlow Condensed',sans-serif; font-size:22px; width:40px; }
  .pts { font-weight:700; }
  .full { grid-column:1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Bracket<span>Hub</span></h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
/* ---- What each tab manages ---- */
const R = {
  teams: {
    title: 'Teams', one: 'team',
    fields: [
      { k:'name', l:'Team name' }, { k:'game', l:'Game' }, { k:'captain', l:'Captain' },
      { k:'country', l:'Country' }, { k:'players', l:'Players (comma separated)', t:'list' },
    ],
    heads: ['Team','Game','Captain','Country','Players'],
    row: x => [x.name, x.game, x.captain, x.country, (x.players||[]).join(', ')],
  },
  tournaments: {
    title: 'Tournaments', one: 'tournament',
    fields: [
      { k:'name', l:'Tournament name' }, { k:'game', l:'Game' },
      { k:'startDate', l:'Start date', t:'date' }, { k:'prizePool', l:'Prize pool (₹)', t:'number' },
      { k:'status', l:'Status', t:'choice', opts:['Upcoming','Live','Finished'] },
    ],
    heads: ['Tournament','Game','Starts','Prize pool','Status'],
    row: x => [x.name, x.game, (x.startDate||'').slice(0,10), '₹' + (x.prizePool||0).toLocaleString('en-IN'), x.status],
  },
  matches: {
    title: 'Matches', one: 'match',
    fields: [
      { k:'tournament', l:'Tournament', t:'ref', from:'tournaments' },
      { k:'teamA', l:'Team A', t:'ref', from:'teams' }, { k:'scoreA', l:'Team A score', t:'number' },
      { k:'teamB', l:'Team B', t:'ref', from:'teams' }, { k:'scoreB', l:'Team B score', t:'number' },
      { k:'playedOn', l:'Played on', t:'date' },
    ],
    heads: ['Tournament','Match','Score','Date'],
    row: x => [x.tournament?.name || '-', (x.teamA?.name||'-') + ' vs ' + (x.teamB?.name||'-'), x.scoreA + ' : ' + x.scoreB, (x.playedOn||'').slice(0,10)],
  },
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (url, method='GET', body) =>
  fetch('/api/' + url, { method, headers:{'Content-Type':'application/json'}, body: body && JSON.stringify(body) }).then(r => r.json());

let tab = 'teams', items = [], lookups = {}, editing = null;

/* ---- Tabs ---- */
function drawNav() {
  const names = { ...Object.fromEntries(Object.entries(R).map(([k,v]) => [k, v.title])), leaderboard:'Leaderboard' };
  $('nav').innerHTML = Object.entries(names).map(([k,v]) =>
    `<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
}
function go(t) { tab = t; editing = null; drawNav(); t === 'leaderboard' ? loadBoard() : load(); }

/* ---- CRUD screens ---- */
async function load() {
  const cfg = R[tab];
  items = await api(tab);
  for (const f of cfg.fields) if (f.t === 'ref' && !lookups[f.from]) lookups[f.from] = await api(f.from);
  for (const k of ['teams','tournaments']) lookups[k] = await api(k);
  draw();
}

function inputFor(f, v) {
  if (f.t === 'ref') {
    const id = v?._id || v || '';
    return `<select id="f_${f.k}"><option value="">Choose…</option>` +
      lookups[f.from].map(o => `<option value="${o._id}" ${o._id===id?'selected':''}>${esc(o.name)}</option>`).join('') + '</select>';
  }
  if (f.t === 'choice')
    return `<select id="f_${f.k}">` + f.opts.map(o => `<option ${o===v?'selected':''}>${o}</option>`).join('') + '</select>';
  const type = f.t === 'number' ? 'number' : f.t === 'date' ? 'date' : 'text';
  let val = v ?? '';
  if (f.t === 'list') val = (v||[]).join(', ');
  if (f.t === 'date') val = String(val).slice(0,10);
  return `<input id="f_${f.k}" type="${type}" value="${esc(val)}">`;
}

function draw() {
  const cfg = R[tab], cur = items.find(i => i._id === editing) || {};
  $('main').innerHTML = `
    <section class="panel">
      <h2>${editing ? 'Edit ' : 'Add '}${cfg.one}</h2>
      ${cfg.fields.map(f => `<label for="f_${f.k}">${f.l}</label>${inputFor(f, cur[f.k])}`).join('')}
      <div class="err" id="err"></div>
      <button class="btn" onclick="save()">${editing ? 'Save changes' : 'Add ' + cfg.one}</button>
      ${editing ? '<button class="btn ghost" onclick="editing=null;draw()">Cancel</button>' : ''}
    </section>
    <section class="panel tbl">
      <h2>${cfg.title} (${items.length})</h2>
      ${items.length ? `<table><tr>${cfg.heads.map(h=>`<th>${h}</th>`).join('')}<th></th></tr>` +
        items.map(x => `<tr>${cfg.row(x).map(c=>`<td>${esc(c)}</td>`).join('')}
          <td><button class="link" onclick="edit('${x._id}')">Edit</button>
              <button class="link del" onclick="del('${x._id}')">Delete</button></td></tr>`).join('') + '</table>'
        : `<div class="empty">No ${cfg.title.toLowerCase()} yet. Add the first one using the form.</div>`}
    </section>`;
}

function edit(id) { editing = id; draw(); window.scrollTo(0, 0); }

async function save() {
  const body = {};
  for (const f of R[tab].fields) {
    let v = $('f_' + f.k).value;
    if (f.t === 'list') v = v.split(',').map(s => s.trim()).filter(Boolean);
    if (f.t === 'number') v = Number(v || 0);
    if (v === '') continue;
    body[f.k] = v;
  }
  const res = editing ? await api(`${tab}/${editing}`, 'PUT', body) : await api(tab, 'POST', body);
  if (res.error) return $('err').textContent = res.error;
  editing = null;
  load();
}

async function del(id) {
  if (!confirm('Delete this ' + R[tab].one + '? Related matches will be removed too.')) return;
  await api(`${tab}/${id}`, 'DELETE');
  load();
}

/* ---- Leaderboard (uses the aggregation pipeline) ---- */
async function loadBoard(tid) {
  const ts = await api('tournaments');
  tid = tid || ts[0]?._id;
  const rows = tid ? await api('leaderboard/' + tid) : [];
  $('main').innerHTML = `
    <section class="panel full tbl">
      <h2>Leaderboard</h2>
      <label for="pick">Tournament</label>
      <select id="pick" onchange="loadBoard(this.value)">
        ${ts.map(t => `<option value="${t._id}" ${t._id===tid?'selected':''}>${esc(t.name)}</option>`).join('')}
      </select>
      ${rows.length ? `<table class="rank" style="margin-top:16px">
        <tr><th>#</th><th>Team</th><th>Played</th><th>Wins</th><th>Score diff</th><th>Points</th></tr>
        ${rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.played}</td><td>${r.wins}</td>
          <td>${r.diff>0?'+':''}${r.diff}</td><td class="pts">${r.points}</td></tr>`).join('')}</table>`
        : `<div class="empty">${ts.length ? 'No matches recorded for this tournament yet.' : 'Create a tournament first.'}</div>`}
    </section>`;
}

drawNav(); load();
</script>
</body>
</html>
